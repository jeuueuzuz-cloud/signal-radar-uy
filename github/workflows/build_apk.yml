name: Build Signal Radar APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project and add packages
        run: |
          mkdir -p app_build
          cd app_build
          flutter create --org com.signalradar --project-name signal_radar .
          cp ../main.dart lib/main.dart
          flutter pub add flutter_blue_plus wifi_scan geolocator permission_handler flutter_map latlong2

      - name: Configure Android Permissions and minSdk
        run: |
          python3 - << 'EOF'
          import os, re

          # 1. تصحيح لون Colors.emerald تلقائياً
          main_path = "app_build/lib/main.dart"
          with open(main_path, "r", encoding="utf-8") as f:
              code = f.read()
          code = code.replace("Colors.emerald", "const Color(0xFF10B981)")
          with open(main_path, "w", encoding="utf-8") as f:
              f.write(code)

          # 2. إضافة صلاحيات البلوتوث والواي فاي والموقع
          manifest_path = "app_build/android/app/src/main/AndroidManifest.xml"
          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
          """
          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()
          if "BLUETOOTH_SCAN" not in manifest:
              manifest = manifest.replace("<application", permissions + "\n    <application", 1)
          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(manifest)

          # 3. رفع minSdk إلى 23
          for gradle_path in ["app_build/android/app/build.gradle.kts", "app_build/android/app/build.gradle"]:
              if os.path.exists(gradle_path):
                  with open(gradle_path, "r", encoding="utf-8") as f:
                      g = f.read()
                  g = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 23", g)
                  g = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 23", g)
                  with open(gradle_path, "w", encoding="utf-8") as f:
                      f.write(g)
          EOF

      - name: Build Release APK
        working-directory: app_build
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signal-radar-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
